apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: sso-core
  namespace: flux-system
spec:
  interval: 10m
  path: ./sso-core
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: sso-workload
  namespace: flux-system
spec:
  dependsOn:
    - name: sso-core
  interval: 10m
  path: ./sso-workload
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system