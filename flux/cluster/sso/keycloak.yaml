apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: sso
spec:
  interval: 1h
  chart:
    spec:
      chart: keycloak
      version: "^22.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      existingSecret: keycloak-admin-secret
    
    production: true
    httpRelativePath: "/sso"
    proxyHeaders: "homelab.nobeledgar3.cloud"
    
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: homelab.nobeledgar3.cloud
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
    
    postgresql:
      enabled: true
      auth:
        existingSecret: keycloak-db-secret
        secretKeys:
          userPasswordKey: postgres-password