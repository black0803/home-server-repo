apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: keycloak-oauth2-proxy-secret
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-oauth2-proxy-secret
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-oauth2-proxy-secret
              key: cookie-secret
        args:
        - --provider=keycloak-oidc
        - --client-id=${OAUTH2_PROXY_CLIENT_ID}
        - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
        - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
        - --email-domain=*
        - --upstream=static://200
        - --oidc-issuer-url=https://homelab.nobeledgar3.cloud/sso/realms/homelab
        - --redirect-url=https://homelab.nobeledgar3.cloud/oauth2/callback
        ports:
        - containerPort: 4180
          name: http
      volumes:
      - name: oauth2-proxy-secret
        secret:
          secretName: keycloak-oauth2-proxy-secret
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  ports:
  - port: 4180
    targetPort: http
    name: http
  selector:
    app: oauth2-proxy