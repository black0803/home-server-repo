apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      initContainers:
        - name: install-combustion
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              wget -qO /tmp/release.zip https://github.com/Secretmapper/combustion/archive/release.zip
              unzip -qo /tmp/release.zip -d /webui
              chown -R 1000:1000 /webui
          volumeMounts:
            - name: webui
              mountPath: /webui
              
      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: TRANSMISSION_WEB_HOME
              value: "/webui/combustion-release"
          ports:
            - containerPort: 9091
              name: webui
            - containerPort: 51413
              name: bittorrent
              protocol: TCP
            - containerPort: 51413
              name: bittorrent-udp
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /downloads
            # 3. Mount the extracted UI into the main container
            - name: webui
              mountPath: /webui
              
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: media
          hostPath:
            path: /var/media
            type: Directory
        # 4. A temporary memory volume to hold the UI files
        - name: webui
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: transmission
  ports:
    - port: 9091
      targetPort: webui
      name: webui