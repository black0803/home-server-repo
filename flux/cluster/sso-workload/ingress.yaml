apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: sso
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: sso-strip-prefix@kubernetescrd
spec:
  rules:
    - host: homelab.nobeledgar3.cloud
      http:
        paths:
          - path: /sso
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080